<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your account using our interactive and responsive registration form.">
    <meta name="theme-color" content="#1E293B">
    <title>Create Your Account | Interactive Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="page-container">
        <section class="form-card" aria-labelledby="form-title">
            <header class="form-header">
                <div class="brand-mark" aria-hidden="true">IF</div>

                <p class="form-label">WELCOME ABOARD</p>

                <h1 id="form-title">Create Your Account</h1>

                <p class="form-description">
                    Fill in your details below to get started.
                </p>
            </header>

            <form id="registrationForm" novalidate>
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                        autocomplete="name" aria-describedby="fullNameError" required>

                    <small class="field-error" id="fullNameError" aria-live="polite"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email"
                        aria-describedby="emailError" required>

                    <small class="field-error" id="emailError" aria-live="polite"></small>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel"
                        aria-describedby="phoneError" required>

                    <small class="field-error" id="phoneError" aria-live="polite"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Create a strong password"
                            autocomplete="new-password" aria-describedby="passwordHint passwordError" required>

                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password"
                            aria-pressed="false">
                            Show
                        </button>
                    </div>

                    <div class="password-strength" aria-live="polite">
                        <div class="strength-bars" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <p id="passwordHint">
                            Use 8+ characters, uppercase and lowercase
                            letters, a number, and a special character.
                        </p>
                    </div>

                    <small class="field-error" id="passwordError" aria-live="polite"></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Re-enter your password" autocomplete="new-password"
                            aria-describedby="confirmPasswordError" required>

                        <button type="button" class="toggle-password" data-target="confirmPassword"
                            aria-label="Show confirm password" aria-pressed="false">
                            Show
                        </button>
                    </div>

                    <small class="field-error" id="confirmPasswordError" aria-live="polite"></small>
                </div>

                <!-- Terms -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" name="terms" aria-describedby="termsError" required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <small class="field-error terms-error" id="termsError" aria-live="polite"></small>

                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    Create Account
                    <span aria-hidden="true">&rarr;</span>
                </button>

                <!-- Form Feedback -->
                <div class="form-feedback" id="formFeedback" role="status" aria-live="polite" tabindex="-1"></div>
            </form>

            <footer class="form-footer">
                <p>
                    Ola Adel
                    <span aria-hidden="true">&bull;</span>
                    2026
                </p>
            </footer>
        </section>

        <p class="page-note">
            A simple, secure-looking, and user-friendly experience.
        </p>
    </main>
</body>

</html>
